# Builds and tests the image of the component, and installs and tests the component in an Ubuntu machine with the
# install scripts. The jobs are the reusable workflows of the bmde repository, shared by all the components.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  image:
    uses: URV-teacher/bmde/.github/workflows/component-image.yml@master
    with:
      image: aleixmt/insight
      # The sources of Insight are reconstructed from the CVS repository of sourceware.org
      setup: sudo apt-get update && sudo apt-get install -y --no-install-recommends cvs rsync
      assets: insight-7.3.50.20110803-cvs.tar.xz
      tests: test_insight.sh test_arm_gdb.sh test_gdb_multiarch.sh
    secrets: inherit

  # Insight is installed from the tarball built by the build stage of the image (scripts/build_tarball.sh), as in hosts
  host:
    uses: URV-teacher/bmde/.github/workflows/component-host.yml@master
    with:
      # The sources of Insight are reconstructed from the CVS repository of sourceware.org. test_operation.sh builds the
      # project that it debugs in DeSmuME, with devkitARM and libnds, installed as a student does
      setup: |
        sudo apt-get update && sudo apt-get install -y --no-install-recommends cvs rsync
        curl -fsSL https://raw.githubusercontent.com/URV-teacher/bmde/master/scripts/install.sh | bash -s -- devkitarm desmume
      assets: insight-7.3.50.20110803-cvs.tar.xz hello-world-nds.tar.gz
      prepare: scripts/build_tarball.sh
      install: install_insight.sh install_gdb_multiarch.sh install_wrapper.sh
      tests: test_insight.sh test_arm_gdb.sh test_gdb_multiarch.sh test_wrapper.sh test_operation.sh
