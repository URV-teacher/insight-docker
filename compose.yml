# Debugs the ELF of the project in the current directory, built with bmde build, with DeSmuME (desmume-docker)
# running in the Docker network bmde-debug with name desmume and --arm9gdb=1024 (as bmde debug does)
services:
  insight:
    pull_policy: always
    build: .
    image: aleixmt/insight:latest
    container_name: insight
    networks:
      - bmde-debug
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.docker.xauth
      - MODE=host
      - DEBUGGER=insight          # or arm-eabi-gdb, gdb-multiarch
      - GDB_TARGET=desmume:1024
    volumes:
      # Project to debug, in the same path where bmde build builds it (/input/<project folder>), so the debugger finds
      # the sources. Set PROJECT to the name of the project folder
      - .:/input/${PROJECT:-project}:ro
      # X11 socket and cookie of the host
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY}:/tmp/.docker.xauth:ro
      # Preferences, sessions and breakpoints of Insight
      - insight_config:/home/insight
    working_dir: /input/${PROJECT:-project}
    stdin_open: true
    tty: true

networks:
  bmde-debug:
    external: true

volumes:
  insight_config:
